services:
  blog-api:
    image: blog-api
    build: .
    ports:
      - "8081:${APP_PORT:-8081}"
    env_file:
      - .env

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-articles}

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
