services:
  blog-api:
    image: blog-api
    build: .
    ports:
      - "8081:${APP_PORT:-8081}"
    env_file:
      - .env

  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: user

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
